<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">

    <title>Index page</title>
</head>

<body>

    <header>
        <div class="container">

            <div class="header-contact">

                <a href="index.html" class="brand">
                    shopping cart
                </a>

                <nav>

                    <ul class="links">
                        <li><a href="login.html">Sign In</a></li>
                        <li><a href="register.html">Sign Up</a></li>
                    </ul>

                    <ul id="user_info">

                        <li>
                            <a href="#" id="user"> <span>Hello</span></a>
                        </li>

                        <li class="shopping_carts">

                            <i class="fa-sharp fa-solid fa-cart-shopping"></i>

                            <span class="badge"></span>

                            <div class="carts_products">
                                <div></div>
                                <a href="cartsproducts.html">
                                    View All Products
                                </a>
                            </div>

                        </li>

                        <li>
                            <a href="#" id="logout">Log Out</a>
                        </li>

                    </ul>

                    <button type="button" id="theme-toggle" class="theme-toggle"
                        aria-label="Switch to light mode" title="Switch theme">
                        <i class="fa-solid fa-sun" aria-hidden="true"></i>
                        <span>Light Mode</span>
                    </button>

                </nav>

            </div>

        </div>
    </header>


    <section class="home">

        <div class="container">

            <div class="search-box">

                <input type="text" id="search-input" placeholder="Search for a product...">

                <button id="search-btn">
                    Search
                </button>

            </div>

            <div class="products">
                <!-- Products will appear here using JavaScript -->
            </div>

        </div>
    </section>


    <script src="java script/scrpit.js"></script>

</body>

</html>
